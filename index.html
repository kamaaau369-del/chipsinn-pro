<!DOCTYPE html><html><head><meta charset=UTF-8><meta name=viewport content='width=device-width,initial-scale=1'><title>SAAS</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#0a0a14;color:#eee}header{padding:10px;background:#12121f;display:flex;justify-content:space-between;position:sticky;top:0}.logo{font-weight:900}.logo span{color:#ff2d7a}.btn{border:none;padding:6px 10px;border-radius:7px;font-weight:800;cursor:pointer}.btn-p{background:#ff2d7a;color:#fff}.btn-d{background:#1b1b2e;color:#fff;border:1px solid #333}.btn-g{background:transparent;color:#888;border:1px solid #333}.card{background:#12121f;border:1px solid #222;border-radius:9px;padding:9px;margin-bottom:7px}input,select{width:100%;padding:7px;background:#1b1b2e;border:1px solid #333;color:#fff;border-radius:6px;margin-top:3px}label{font-size:8px;color:#888;margin-top:5px;display:block}table{width:100%;border-collapse:collapse}th{color:#888;font-size:8px;padding:4px;border-bottom:1px solid #222;text-align:left}td{padding:4px;border-bottom:1px solid #1a1a1a;font-size:10px}.hidden{display:none!important}#loginPage{height:100vh;display:grid;place-items:center;padding:12px}</style></head><body>

<div id=sB></div>

<div id=pB class=card><b id=pT>POS</b><div style='display:flex;gap:5px;margin-top:5px'><input id=bcI placeholder='Barcode'><button class='btn btn-p' onclick=aBc()>Add</button></div><div id=cBox style='margin-top:6px'></div><div style='display:flex;justify-content:space-between;font-weight:900;margin-top:5px'><span>Total</span><span id=tP>KSh 0</span></div><input id=cI placeholder='Customer' style='margin-top:5px'><button class='btn btn-p' style='width:100%;margin-top:5px;padding:9px' onclick=fS()>COMPLETE</button><button class='btn btn-g' style='width:100%;margin-top:3px' onclick=cC()>Clear</button></div>

<script>
function G(){let d=localStorage.getItem('SAAS');if(!d){let b=[{id:"CH001",name:"Chips Regular",cat:"Chips Inn",price:150,cost:80,stock:100,barcode:"001"},{id:"CH002",name:"Chips Large",cat:"Chips Inn",price:250,cost:130,stock:80,barcode:"002"},{id:"CK001",name:"Chicken + Chips",cat:"Chips Inn",price:450,cost:250,stock:50,barcode:"003"},{id:"SM001",name:"Samosa",cat:"Chips Inn",price:40,cost:20,stock:150,barcode:"006"},{id:"DR001",name:"Soda",cat:"Drinks",price:80,cost:45,stock:120,barcode:"301"},{id:"CW001",name:"Car Wash",cat:"Car Wash",price:300,cost:50,stock:9999,barcode:"101"}];let f={cr:{u:"creator",p:"Creator@2026!"},o:[{id:"OWN"+Date.now(),u:"owner",p:"Owner@2026!",biz:"Main",blocked:false,inf:0,st:JSON.parse(JSON.stringify(b)),sa:[]}]};localStorage.setItem('SAAS',JSON.stringify(f));return f;}return JSON.parse(d);}function S(a){localStorage.setItem('SAAS',JSON.stringify(a));}
let DB=G(),CART=[],CF='all',CUR=null,ROLE=null;

function L(){DB=G();let user=u.value.trim(),pass=p.value,er=e;er.innerText='';if(!user){er.innerText='Enter user';return;}if(user==DB.cr.u&&pass==DB.cr.p){localStorage.setItem('SESS',JSON.stringify({r:'cr'}));O('cr');return;}let f=DB.o.find(o=>o.u==user);if(f){if(f.blocked){er.innerText='BLOCKED BY CREATOR';return;}if(f.p!=pass){er.innerText='Wrong pass';return;}localStorage.setItem('SESS',JSON.stringify({r:'ow',id:f.id}));O('ow',f.id);return;}if(user.toLowerCase()=='customer'){let act=DB.o.filter(o=>!o.blocked);if(act.length==0){er.innerText='No active';return;}localStorage.setItem('SESS',JSON.stringify({r:'cu'}));O('cu');return;}er.innerText='Not found';}
function O(r,oid){let s=JSON.parse(localStorage.getItem('SESS')||'{}');if(!r)r=s.r;if(!oid)oid=s.id;ROLE=r;DB=G();loginPage.classList.add('hidden');appPage.classList.remove('hidden');if(r=='cr'){CUR=null;cB.classList.remove('hidden');sB.classList.add('hidden');stC.classList.add('hidden');aC.classList.add('hidden');saC.classList.add('hidden');pB.classList.add('hidden');mB.classList.add('hidden');cBr.classList.add('hidden');wI.innerText='CREATOR GOD';bL.innerText='SAAS ADMIN';rCr();return;}if(r=='ow'){let o=DB.o.find(x=>x.id==oid);if(!o){logout();return;}CUR=o;cB.classList.add('hidden');cBr.classList.add('hidden');pB.classList.remove('hidden');mB.classList.remove('hidden');stC.classList.remove('hidden');aC.classList.remove('hidden');saC.classList.remove('hidden');sB.classList.remove('hidden');bL.innerText=o.biz.toUpperCase();wI.innerText='OWNER: '+o.u;R();return;}if(r=='cu'){CUR=null;cB.classList.add('hidden');stC.classList.add('hidden');aC.classList.add('hidden');saC.classList.add('hidden');sB.classList.add('hidden');pB.classList.remove('hidden');mB.classList.remove('hidden');cBr.classList.remove('hidden');wI.innerText='CUSTOMER';let sel=brS;sel.innerHTML='';DB.o.filter(o=>!o.blocked).forEach(o=>{sel.innerHTML+=`<option value="${o.id}">${o.biz}</option>`});if(DB.o.filter(o=>!o.blocked).length>0){CUR=DB.o.filter(o=>!o.blocked)[0];bL.innerText=CUR.biz.toUpperCase();R();}return;}}
function logout(){localStorage.removeItem('SESS');location.reload();}
function rCr(){DB=G();let ts=DB.o.reduce((s,o)=>s+o.sa.reduce((a,b)=>a+b.total,0),0);cS.innerHTML=`<div style='display:grid;grid-template-columns:1fr 1fr;gap:5px'><div class=card><small>OWNERS</small><h2>${DB.o.length}</h2></div><div class=card><small>TOTAL SALES</small><h2>KSh ${ts}</h2></div></div>`;let b=oB;b.innerHTML='';DB.o.forEach(o=>{let s=o.sa.reduce((a,b)=>a+b.total,0);b.innerHTML+=`<tr><td><b>${o.biz}</b></td><td>${o.u}</td><td>KSh ${s}</td><td>${o.blocked?'<span style="color:red">BLOCKED</span>':'<span style="color:#00e676">ACTIVE</span>'}</td><td><button class='btn btn-d' style='padding:2px 5px;font-size:8px' onclick=tB('${o.id}')>${o.blocked?'Unblock':'Block'}</button> <button class='btn btn-g' style='padding:2px 5px;font-size:8px' onclick=dO('${o.id}')>Del</button></td></tr>`;});}
function C(){let biz=nB.value.trim(),user=nU.value.trim(),pass=nP.value.trim();if(!biz||!user||!pass){cM.innerText='Fill all';return;}DB=G();if(DB.o.find(o=>o.u==user)){cM.innerText='User exists';return;}let b=[{id:"CH001",name:"Chips Regular",cat:"Chips Inn",price:150,cost:80,stock:100,barcode:"001"},{id:"CH002",name:"Chips Large",cat:"Chips Inn",price:250,cost:130,stock:80,barcode:"002"},{id:"CK001",name:"Chicken + Chips",cat:"Chips Inn",price:450,cost:250,stock:50,barcode:"003"},{id:"SM001",name:"Samosa",cat:"Chips Inn",price:40,cost:20,stock:150,barcode:"006"},{id:"DR001",name:"Soda",cat:"Drinks",price:80,cost:45,stock:120,barcode:"301"},{id:"CW001",name:"Car Wash",cat:"Car Wash",price:300,cost:50,stock:9999,barcode:"101"}];DB.o.push({id:"OWN"+Date.now(),u:user,p:pass,biz:biz,blocked:false,inf:0,st:b,sa:[]});S(DB);nB.value='';nU.value='';nP.value='';cM.innerText='Created '+biz; rCr();}
function tB(id){DB=G();let o=DB.o.find(x=>x.id==id);o.blocked=!o.blocked;S(DB);rCr();}
function dO(id){if(!confirm('Delete?'))return;DB=G();DB.o=DB.o.filter(x=>x.id!=id);S(DB);rCr();}
function sBr(){let id=brS.value;DB=G();CUR=DB.o.find(x=>x.id==id);bL.innerText=CUR.biz.toUpperCase();R();}
function R(){rSt();rMg();rCt();rSa();}
function rSt(f=''){let o=CUR;let b=stB;b.innerHTML='';let l=o.st;if(f){let x=f.toLowerCase();l=l.filter(s=>s.name.toLowerCase().includes(x));}l.forEach(t=>{let pr=Math.round(t.price*(1+(o.inf||0)/100));b.innerHTML+=`<tr><td>${t.name}</td><td>KSh ${pr}</td><td>${t.stock}</td><td><button class='btn btn-g' style='padding:2px 4px;font-size:8px' onclick=eI('${t.id}')>E</button> <button class='btn btn-g' style='padding:2px 4px;font-size:8px' onclick=dI('${t.id}')>X</button></td></tr>`});}
function rMg(){let o=CUR;let g=mG;g.innerHTML='';let l=o.st.filter(s=>s.stock>0||s.cat=='Car Wash');if(CF!='all')l=l.filter(s=>s.cat==CF);l.forEach(t=>{let pr=Math.round(t.price*(1+(o.inf||0)/100));g.innerHTML+=`<div class=card><b>${t.name}</b><br><small style='color:#888'>${t.cat}</small><div style='display:flex;justify-content:space-between;margin-top:5px'><b style='color:#ff2d7a'>KSh ${pr}</b><button class='btn btn-p' style='padding:3px 6px' onclick=aT('${t.id}')>+</button></div></div>`});}
function sM(c){CF=c;rMg();}
function aT(id){let o=CUR;let i=o.st.find(s=>s.id==id),sell=Math.round(i.price*(1+(o.inf||0)/100)),f=CART.find(c=>c.id==id);if(f)f.qty++;else CART.push({id:i.id,name:i.name,qty:1,sell:sell,cost:i.cost});rCt();}
function aBc(){let c=bcI.value.trim(),o=CUR,i=o.st.find(s=>s.barcode==c);if(!i){alert('Not found');return;}aT(i.id);bcI.value='';}
function rCt(){let b=cBox,t=0;b.innerHTML='';CART.forEach(c=>{t+=c.sell*c.qty;b.innerHTML+=`<div style='display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid #1a1a1a'><span>${c.qty}x ${c.name}</span><span>KSh ${c.sell*c.qty} <button onclick=rC('${c.id}') style='background:none;border:none;color:red'>X</button></span></div>`});tP.innerText='KSh '+t;}
function rC(id){CART=CART.filter(c=>c.id!=id);rCt();}
function cC(){CART=[];rCt();}
function fS(){if(CART.length==0){alert('Empty');return;}let o=CUR;let total=CART.reduce((s,c)=>s+c.sell*c.qty,0),sale={id:'SL'+Date.now(),date:new Date().toISOString(),total:total,items:CART.map(c=>c.qty+'x '+c.name).join(', ')};DB=G();let idx=DB.o.findIndex(x=>x.id==o.id);DB.o[idx].sa.unshift(sale);CART.forEach(c=>{let st=DB.o[idx].st.find(s=>s.id==c.id);if(st&&st.cat!='Car Wash')st.stock-=c.qty;});S(DB);DB=G();CUR=DB.o.find(x=>x.id==o.id);CART=[];R();alert('ORDER KSh '+total+' at '+CUR.biz);}
function aI(){let o=CUR;let n=iN.value.trim(),ca=iC.value,pr=parseFloat(iP.value),st=parseInt(iS.value)||0;if(!n||!pr){alert('Need name price');return;}DB=G();let idx=DB.o.findIndex(x=>x.id==o.id);let id=ca.substring(0,2).toUpperCase()+Date.now().toString().slice(-4);DB.o[idx].st.push({id:id,name:n,cat:ca,price:pr,cost:pr*0.6,stock:st,barcode:id});S(DB);iN.value='';iP.value='';iS.value='';DB=G();CUR=DB.o.find(x=>x.id==o.id);R();}
function eI(id){let o=CUR;DB=G();let idx=DB.o.findIndex(x=>x.id==o.id);let it=DB.o[idx].st.find(s=>s.id==id),np=prompt('Price',it.price);if(np)it.price=parseFloat(np);S(DB);DB=G();CUR=DB.o.find(x=>x.id==o.id);R();}
function dI(id){if(!confirm('Delete?'))return;DB=G();let idx=DB.o.findIndex(x=>x.id==CUR.id);DB.o[idx].st=DB.o[idx].st.filter(s=>s.id!=id);S(DB);DB=G();CUR=DB.o.find(x=>x.id==CUR.id);R();}
function rSa(){let o=CUR;let total=o.sa.reduce((s,x)=>s+x.total,0),today=o.sa.filter(s=>new Date(s.date).toDateString()==new Date().toDateString()).reduce((s,x)=>s+x.total,0);sB.innerHTML=`<div style='display:grid;grid-template-columns:1fr 1fr;gap:5px'><div class=card><small>TODAY</small><h2>KSh ${today}</h2></div><div class=card><small>TOTAL</small><h2>KSh ${total}</h2></div></div>`;let sb=saB;sb.innerHTML='';o.sa.slice(0,80).forEach(s=>{let d=new Date(s.date);sb.innerHTML+=`<tr><td>${d.toLocaleDateString()} ${d.toLocaleTimeString()}</td><td>KSh ${s.total}</td><td><small>${s.items}</small></td></tr>`});}
window.onload=function(){let sess=localStorage.getItem('SESS');if(sess){let s=JSON.parse(sess);O(s.r,s.id);}p.addEventListener('keydown',e=>{if(e.key=='Enter')L();});};
</script></body></html>
